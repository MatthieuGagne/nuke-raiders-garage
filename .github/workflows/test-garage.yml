name: test-garage

# Panel coverage (tests/garage/). Needs PySide6 -- AC16. Kept in a
# separate workflow so the default suite's job never installs Qt.
on:
  push:
  pull_request:

jobs:
  test-garage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requirements (PySide6)
        run: pip install -r requirements.txt

      # -u, -v and faulthandler are diagnostics, not noise. A Qt suite can
      # die on an abort rather than a failure, unittest prints its summary
      # last, and buffered output is lost when a process is terminated -- so
      # an abort otherwise leaves a log that names nothing. This run failed
      # once with exactly `...................F` and nothing else.
      #
      # They were not enough on their own: #8's interpreter died by Windows
      # fail-fast, which bypasses faulthandler entirely, and naming it took
      # a process watcher running outside the interpreter. That apparatus
      # was retired with the issue -- `git log -- tools/garage/ci` has it,
      # and it is worth restoring rather than reinventing if a job ever
      # again ends without saying why.
      #
      # The exit code is echoed because a job whose log ends in `OK` and
      # still fails is the exact shape #8 wasted weeks on. `1` there is
      # usually the shell's, standing in for a child that died some other
      # way; 0xC0000409 is a Windows fail-fast, which faulthandler cannot
      # see and which Qt reaches by destroying a QThread that is still
      # running.
      - name: Run panel test suite
        run: |
          python -u -X faulthandler -m unittest discover -s tests/garage -p 'test_*.py' -v
          $code = $LASTEXITCODE
          $hex = '0x{0:X8}' -f ([int64] $code -band 0xFFFFFFFF)
          Write-Host "python exited $code ($hex)"
          exit $code
