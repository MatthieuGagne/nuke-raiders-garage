name: test-garage

# Panel coverage (tests/garage/). Needs PySide6 -- AC16. Kept in a
# separate workflow so the default suite's job never installs Qt.
on:
  push:
  pull_request:

jobs:
  test-garage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install requirements (PySide6)
        run: pip install -r requirements.txt
      - name: Run panel test suite
        run: python -m unittest discover -s tests/garage -p 'test_*.py'
